name: CORE PORFOLIO CI
on: [push]

defaults:
  run:
    working-directory: ./

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Nodejs
        uses: actions/setup-node@v2
        with: 
          node-version: 16
          cache: 'npm'

      - name: Install
        shell: bash
        run: npm ci

      - name: Run unit test
        shell: bash
        run: npm run test