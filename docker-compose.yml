version: '3.3'

services:
  mongo-test:
    image: mongo:latest
    container_name: mongo-test
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: p@55w0rd
    ports:
      - 27020:27017

  mongo-dev:
    image: mongo:latest
    container_name: mongo-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - 27022:27017
    volumes: 
      - ./datadir:/data/db
  postgres-test:
    image: postgres
    environment:
      - POSTGRES_DB=portfolio
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    ports:
      - 5456:5432
  
  postgres-dev:
    image: postgres
    environment:
      - POSTGRES_DB=portfolio
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
    ports:
      - 5454:5432
    volumes:
      - ./postgresdata:/var/lib/postgresql

  mysql-dev:
    image: mysql:5.7.16
    environment:
      - MYSQL_DATABASE=portfolio
      - MYSQL_ROOT_PASSWORD=p@55w0rd
      - MYSQL_PORT=3306
    ports:
      - 3306:3306
    volumes:
      - ./mysqldata:/var/lib/mysql

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mail.com
      - PGADMIN_DEFAULT_PASSWORD=p@55w0rd
    ports:
      - 5050:80
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      - MYSQL_ROOT_PASSWORD=p@55w0rd
      - PMA_HOST=mysql
    ports:
      - 8080:80